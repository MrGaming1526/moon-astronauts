<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASA Apollo GOD MODE</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  overflow-x: hidden;
  font-family: Arial;
  color: white;
  background: black;
}

/* 🌌 canvas layers */
#space, #earth {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

/* 🧑‍🚀 intro */
.intro {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.intro h1 {
  font-family: Orbitron;
  font-size: 40px;
}

.intro p {
  color: #aaa;
}

/* 🛰️ HUD */
.hud {
  position: fixed;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
}

/* scroll sections */
.section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  text-align: center;
  padding: 20px;
}

/* cards */
.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(8px);
  max-width: 500px;
}
</style>
</head>

<body>

<!-- 🌌 star canvas -->
<canvas id="space"></canvas>

<!-- 🌍 3D Earth -->
<canvas id="earth"></canvas>

<!-- 🛰️ HUD -->
<div class="hud">
  <div>MISSION: APOLLO PROGRAM</div>
  <div id="status">STATUS: ACTIVE</div>
  <button onclick="toggleSound()">🔊 SOUND</button>
</div>

<!-- 🚀 INTRO -->
<div class="intro">
  <h1>NASA MISSION CONTROL</h1>
  <p>Scroll to experience Apollo Moon Missions</p>
</div>

<!-- 🧑‍🚀 STORY -->
<div class="section">
  <div class="card">
    <h2>1969 — Apollo 11</h2>
    <p>Neil Armstrong becomes the first human on the Moon.</p>
  </div>
</div>

<div class="section">
  <div class="card">
    <h2>First Step</h2>
    <p>“That's one small step for man…”</p>
  </div>
</div>

<div class="section">
  <div class="card">
    <h2>1972 — Apollo 17</h2>
    <p>Last humans to walk on the Moon.</p>
  </div>
</div>

<!-- 🔊 audio -->
<audio id="audio" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_c8a7b8c2f3.mp3?filename=space-ambient-118841.mp3">
</audio>

<script>

/* 🌌 STAR FIELD */
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = Array(200).fill().map(()=>({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
}));

function drawStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";

stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
s.y += 0.3;
if(s.y>canvas.height) s.y=0;
});

requestAnimationFrame(drawStars);
}
drawStars();

/* 🌍 THREE.JS EARTH */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById("earth"), alpha:true});
renderer.setSize(innerWidth, innerHeight);

const geometry = new THREE.SphereGeometry(2, 32, 32);
const texture = new THREE.TextureLoader().load("https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg");
const material = new THREE.MeshBasicMaterial({map:texture});
const earth = new THREE.Mesh(geometry, material);

scene.add(earth);
camera.position.z = 6;

function animate(){
requestAnimationFrame(animate);
earth.rotation.y += 0.002;
renderer.render(scene, camera);
}
animate();

/* 🔊 sound */
function toggleSound(){
let a=document.getElementById("audio");
if(a.paused){a.play(); alert("Space ambience ON 🚀");}
else {a.pause(); alert("Space ambience OFF");}
}

/* 📜 scroll effects */
window.addEventListener("scroll",()=>{
document.getElementById("status").innerText =
window.scrollY > 200 ? "STATUS: ORBITING" : "STATUS: ACTIVE";
});

</script>

</body>
</html>
